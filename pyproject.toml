[project]
name = "dev-process"
version = "2.5.2"
description = "Portable, harness-agnostic AI-assisted development process (copier template)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[dependency-groups]
dev = ["copier>=9.4", "pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
