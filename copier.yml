_subdirectory: template
_answers_file: .copier-answers.yml
_min_copier_version: "9.4.0"

project_name:
  type: str
  help: "Human-readable project name"

harness:
  type: str
  help: >-
    The AI harness whose command adapters render (the methodology and gates
    are harness-neutral either way; the Spec Kit integration covers further
    agents).
  choices:
    - claude
    - copilot
    - agents_md
  default: claude

# derived from `harness` — kept as a mapping because every template condition
# and the gate runner key on harnesses.<name>; not asked.
harnesses:
  type: yaml
  when: false
  default: "{claude: {{ harness == 'claude' }}, copilot: {{ harness == 'copilot' }}, agents_md: {{ harness == 'agents_md' }}}"

regulated:
  type: bool
  help: >-
    Regulated pack: adds the sbom (CycloneDX + license allow-list) and
    security-floor (forbidden-pattern) gates for compliance-bound projects.
  default: false

# The standard setup is fixed (lean pass): one opinionated module set, on by
# default, instead of thirteen toggles. The only switch is `regulated` above.
# The mapping stays overridable via `copier ... --data modules=...` for the
# rare expert opt-out; it is not asked interactively.
modules:
  type: yaml
  when: false
  default: "{speckit: true, doc_drift_gate: true, arch_onboarding: true, feature_registry: true, github_issues: true, contracts: true, git_hooks: true, security_floor: {{ regulated }}, sbom: {{ regulated }}, telemetry: true, arch_docs: true, github_master: true}"

ci:
  type: yaml
  help: >-
    CI adapter rendering the process-gates job (github: Actions workflow).
    With it off, enforcement degrades to the local git-hooks module only.
  default:
    github: true

github_repo:
  type: str
  help: >-
    GitHub repo as OWNER/REPO for issue tracking (optional — leave blank to skip
    the best-effort issue-existence check; issue-ref format is still enforced).
  default: ""
  when: "{{ modules.github_issues }}"
